name: Android CI

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Build
        env:
          SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          SONATYPE_NEXUS_USERNAME_V2: ${{ secrets.SONATYPE_NEXUS_USERNAME_V2 }}
          SONATYPE_NEXUS_PASSWORD_V2: ${{ secrets.SONATYPE_NEXUS_PASSWORD_V2 }}
          KINTA_GPG_PRIVATE_KEY: ${{ secrets.KINTA_GPG_PRIVATE_KEY }}
          KINTA_GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.KINTA_GPG_PRIVATE_KEY_PASSWORD }}
          KINTA_STAGING_PROFILE_ID: ${{ secrets.KINTA_STAGING_PROFILE_ID }}
        run: |
          if [ ${{ github.event_name }} != 'pull_request' ]
          then
            eval `ssh-agent -s`
            ssh-add - <<< "${{ secrets.SSH_DEPLOY_KEY }}"
            git remote set-url origin git@github.com:dailymotion/kinta.git
            git config --global user.email "apps@dailymotion.com"
            git config --global user.name "Kinta GithubActions"
            python3 -m venv venv
            which pip
            PIP_BREAK_SYSTEM_PACKAGES=1 pip install mkdocs-material
            mkdocs -V
          fi
          ./gradlew clean assemble deployArtifactsIfNeeded deployDocsIfNeeded -i --stacktrace

      - name: Transfer staged artifacts to Sonatype Central Portal
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SONATYPE_NEXUS_USERNAME_V2: ${{ secrets.SONATYPE_NEXUS_USERNAME_V2 }}
          SONATYPE_NEXUS_PASSWORD_V2: ${{ secrets.SONATYPE_NEXUS_PASSWORD_V2 }}
        run: |
          # Artifacts uploaded with maven-publish land in the namespace's default staging
          # repository of the OSSRH Staging API. They must be explicitly transferred to the
          # Central Portal, otherwise they never reach Maven Central.
          # See https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
          TOKEN=$(printf '%s:%s' "$SONATYPE_NEXUS_USERNAME_V2" "$SONATYPE_NEXUS_PASSWORD_V2" | base64 -w0)

          HTTP_CODE=$(curl -sS -o /tmp/transfer_response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.dailymotion?publishing_type=automatic")
          echo "Transfer response ($HTTP_CODE):"
          cat /tmp/transfer_response.txt
          echo

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Transfer to Central Portal failed with status $HTTP_CODE"
            exit 1
          fi

          echo "Deployment created, follow validation and publication on https://central.sonatype.com/publishing/deployments"
